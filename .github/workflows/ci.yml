name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies & Audit
        run: |
          pip install -r aiml/requirements.txt
          python -m py_compile tests/*.py aiml/**/*.py

  determinism-and-netcode-tests:
    name: Core Netcode & 1M Frame Determinism Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Test Suite
        run: |
          pip install -r aiml/requirements.txt
          python tests/test_determinism.py
          python tests/test_rollback.py
          python aiml/eval/evaluate_cheat_detection.py
          python aiml/eval/evaluate_jitter_predictor.py
