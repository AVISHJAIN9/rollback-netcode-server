[package]
name = "rollback-netcode-server"
version = "0.1.0"
edition = "2021"
authors = ["Avish Jain <avishjain@example.com>"]
description = "Deterministic server-authoritative multiplayer netcode engine with rollback resimulation."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono"], optional = true }
redis = { version = "0.25", features = ["tokio-comp"], optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "simulation_bench"
harness = false
